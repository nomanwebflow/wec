    - generic [ref=f10e324]:
      - generic [ref=f10e325]:
        - heading "The longer you wait, the harder this gets" [level=2] [ref=f10e348]
        - generic [ref=f10e349]:
          - paragraph [ref=f10e350]: Two reasons, and only one of them is medical.
          - paragraph [ref=f10e351]: Dr. Morgan sees crash patients same-day when he can. One recent patient wrecked his car in the evening, booked that night, and was in the office the next morning
      - generic [ref=f10e352]:
        - generic [ref=f10e354]:
          - generic [ref=f10e355]: Medically
          - paragraph [ref=f10e357]: Soft tissue injuries that get treated early tend to resolve more cleanly than the ones that get ignored for six weeks. Scar tissue forms. Compensation patterns set in. You start moving differently without noticing.
        - generic [ref=f10e359]:
          - generic [ref=f10e360]: Practically
          - paragraph [ref=f10e362]: A gap between your crash and your first medical visit is the first thing an insurance adjuster will point to. Not because you're lying, but because a delay is easy to use against you.
    - generic [ref=f10e365]:
      - generic [ref=f10e367]:
        - heading "You almost certainly aren't paying for this yourself" [level=2] [ref=f10e369]
        - paragraph [ref=f10e371]: This is the part that stops most people from getting checked, and it usually shouldn't.
      - generic [ref=f10e373]:
        - generic [ref=f10e374]:
          - listitem [ref=f10e375]:
            - generic [ref=f10e380]:
              - heading "PIP (Personal Injury Protection)" [level=4] [ref=f10e381]
              - paragraph [ref=f10e383]: is part of most Texas auto policies unless you specifically declined it in writing. It covers medical care after a crash regardless of who caused it. It's your own coverage.
          - listitem [ref=f10e384]:
            - generic [ref=f10e389]:
              - heading "Letter of Protection (LOP)" [level=4] [ref=f10e390]
              - paragraph [ref=f10e392]: means treatment now, payment later out of the settlement. No money up front.
          - listitem [ref=f10e393]:
            - generic [ref=f10e398]:
              - heading "Third-party claims" [level=4] [ref=f10e399]
              - paragraph [ref=f10e401]: bill the at-fault driver's insurance directly.
        - paragraph [ref=f10e403]: We handle all three in house. Tell us what you have and we'll tell you what it covers before you're treated.
