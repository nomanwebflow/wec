    - generic [ref=f10e163]:
      - heading "You were in a wreck and you're not sure if you're hurt" [level=2] [ref=f10e186]
      - generic [ref=f10e187]:
        - paragraph [ref=f10e188]: Maybe you walked away and felt fine. Maybe your neck got stiff the next morning. Maybe it's been four days and your headaches haven't stopped.
        - paragraph [ref=f10e189]: Crash injuries are strange that way. Adrenaline covers a lot in the first 24 hours, and some of the worst ones show up days later, after the insurance adjuster has already called and asked how you're feeling.
        - paragraph [ref=f10e190]:
          - strong [ref=f10e191]: Getting checked early does two things. It tells you whether something's actually wrong, and it puts your injuries on record from the beginning.
      - generic [ref=f10e193]:
        - heading "We treat auto accident injuries only" [level=3] [ref=f10e194]
        - paragraph [ref=f10e196]: No slip and fall, no workers comp. Auto is what we know and it's what we're set up for.
      - generic [ref=f10e199]:
        - button "Book Your Visit" [ref=f10e201] [cursor=pointer]
        - generic [ref=f10e204]:
          - generic [aria-hidden] [ref=f10e205]: Book Your Visit
          - generic [aria-hidden] [ref=f10e206]: Book Your Visit
    - generic [ref=f10e215]:
      - heading "Whiplash is not a diagnosis. It's a description." [level=2] [ref=f10e238]
      - generic [ref=f10e239]:
        - paragraph [ref=f10e240]: "\"Whiplash\" just means your head moved faster than your neck was ready for. What that actually did to you varies enormously, which is why the exam matters more here than almost anywhere else."
        - paragraph [ref=f10e241]: With a crash patient, Dr. Morgan is looking for more than a stiff neck. He checks how your neck moves in every direction, where it hurts and where it doesn’t, and whether there’s any numbness, tingling, or headaches that point to a nerve being involved. He also asks about the crash itself, because the direction of the hit tells him where to look.
        - paragraph [ref=f10e242]: On the X-ray, a healthy neck has a gentle curve. After a crash, that curve often straightens out, the head shifts forward, and the joints stop moving together the way they should. Those findings turn “my neck is sore” into a documented injury.
      - generic [ref=f10e244]:
        - heading "Imaging happens on site, the same day" [level=3] [ref=f10e245]
        - paragraph [ref=f10e247]: "Dr. Morgan takes digital X-rays when the exam calls for them, reads them himself, and shows them to you right then. For a crash case that matters twice over: you find out what's wrong, and it's documented from day one."
    - generic [ref=f10e250]:
      - generic [ref=f10e252]:
        - generic [ref=f10e253]: What we do about it
        - heading [level=2] [ref=f10e255]:
          - strong [ref=f10e256]: Find it, fix it, document it properly
      - list [ref=f10e258]:
        - generic [ref=f10e259]:
          - img "Chiropractic treatment process, step 1" [ref=f10e261]
          - generic [ref=f10e262]:
            - heading "Find it" [level=3] [ref=f10e268]
            - paragraph [ref=f10e269]: Full history and exam, focused on how the crash actually happened. Which direction, were you braced, headrest position, where you felt it first. Any necessary digital X-rays, taken on site
        - generic [ref=f10e271]:
          - img "Chiropractic treatment process, step 2" [ref=f10e273]
          - generic [ref=f10e274]:
            - heading "Fix it" [level=3] [ref=f10e280]
            - paragraph [ref=f10e281]: Adjustments, and spinal decompression where imaging supports it. Auto injury plans typically run longer than a standard care plan because crash injuries involve soft tissue that heals on its own timeline.
        - generic [ref=f10e282]:
          - img "Chiropractic treatment process, step 3" [ref=f10e284]
          - generic [ref=f10e285]:
            - heading "Document it" [level=3] [ref=f10e291]
            - paragraph [ref=f10e292]: Every visit is recorded properly. If your case involves an insurer or an attorney, the paperwork holds up.
