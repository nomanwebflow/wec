          - listitem [ref=f5e555]:
            - img "Tai Lee, patient avatar" [ref=f5e557]
            - generic [ref=f5e558]:
              - heading "Tai Le" [level=4] [ref=f5e559]
              - paragraph [ref=f5e560]: Chiropractic Assistant
              - paragraph [ref=f5e562]: With West End since 2017, which makes him the person here longest besides Casey. UT grad in kinesiology, plays tennis, and good odds he's the one who answers when you call.
          - listitem [ref=f5e563]:
            - img "Gabriella, patient avatar" [ref=f5e565]
            - generic [ref=f5e566]:
              - heading "Gabriella \"Gabby\" Menendez" [level=4] [ref=f5e567]
              - paragraph [ref=f5e568]: Chiropractic Assistant
              - paragraph [ref=f5e570]: "Came to Austin from New Orleans at the end of 2025, already a chiropractic assistant. Most people relax before they even sit down. Outside work: books, movies, and capybaras."
