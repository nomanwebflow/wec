        - generic [ref=f5e527]:
          - heading [level=2] [ref=f5e529]:
            - strong [ref=f5e530]: Casey Morgan D.C.
            - text: Second-generation Austin chiropractor
          - generic [ref=f5e531]:
            - paragraph [ref=f5e532]: Dr. Morgan grew up noticing two things. Other kids were always going to the doctor and he never was. And his dad loved going to work every single day. At sixteen he decided he'd be a chiropractor too.
            - paragraph [ref=f5e533]: Parker University graduate. Board Certified by the NBCE. Second generation. Adjusting patients in downtown Austin since 2016.
            - paragraph [ref=f5e534]: His approach is simple. Find the actual cause. Fix it. Then keep it from coming back.
            - paragraph [ref=f5e535]:
              - strong [ref=f5e536]: If you've been to a chiropractor who just cracked you and sent you out, this will feel different.
          - generic [ref=f5e537]:
            - button "Read Casey's full story" [ref=f5e539] [cursor=pointer]
            - generic [ref=f5e547]:
              - generic [aria-hidden] [ref=f5e548]: Read Casey's full story
              - generic [aria-hidden] [ref=f5e549]: Read Casey's full story
