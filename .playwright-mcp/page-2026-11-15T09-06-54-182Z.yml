        - generic [ref=f5e195]:
          - paragraph [ref=f5e196]:
            - text: When your back locks up during a meeting, or your neck stiffens at your desk, or a headache turns a Wednesday into a lost day, it's not just discomfort.
            - strong [ref=f5e197]: It's your work, your workouts, your time with family. All of it takes a hit.
          - paragraph [ref=f5e198]: Most people push through it. They stretch. They pop ibuprofen. They tell themselves it will pass. Sometimes it does. Sometimes it doesn't.
          - paragraph [ref=f5e199]: If pain has been showing up more often, lasting longer, or getting worse, that's a signal. Something structural is going on and it's time to find out what.
