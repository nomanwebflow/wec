      - generic [ref=e168]:
        - heading "Pain is the symptom. It is not the problem." [level=2] [ref=e191]
        - generic [ref=e192]:
          - paragraph [ref=e193]: By the time your back hurts enough to look up a chiropractor, the thing causing it has usually been building for a while.
          - paragraph [ref=e194]: Most commonly we find disc space that has narrowed, degeneration that has started to set in, or a joint that stopped moving the way it should and made everything around it work harder to compensate.
          - paragraph [ref=e195]:
            - emphasis [ref=e196]: You cannot stretch your way out of a structural problem. That is why the stretching stopped working.
          - paragraph [ref=e197]: "Low back problems are usually chronic, so the goal is a new baseline: get you out of pain, then slow the wear down from there."
        - generic [ref=e199]:
          - heading "This is why we image before we treat." [level=3] [ref=e200]
          - paragraph [ref=e202]: Dr. Morgan takes digital X-rays on site when your exam calls for it, reads them himself, and shows them to you the moment they come up. No separate imaging appointment. No waiting a week to find out what is going on.
