        - heading "Most of the low back pain we see comes from two places" [level=2] [ref=e142]
        - generic [ref=e143]:
          - paragraph [ref=e144]: You pushed too hard in the gym, and you've been pushing too hard for a while. Or you spent a weekend on the yard and something let go on Sunday night.
          - paragraph [ref=e145]: It's rarely one moment. It's usually months or years of the same thing, and then one ordinary movement is the one your back finally objects to. Tying a shoe. Lifting a bag out of the trunk.
          - paragraph [ref=e146]:
            - emphasis [ref=e147]: If that sounds familiar, you're the person this page is for.
