      - heading [level=2] [ref=e283]:
        - strong [ref=e284]: Your first visit, start to finish
      - list [ref=e285]:
        - listitem [ref=e286]:
          - generic [ref=e287]: "1"
          - generic [ref=e288]:
            - heading "We find out what is actually happening" [level=3] [ref=e289]
            - paragraph [ref=e290]: Full history and exam. What hurts, what you have already tried, what you want to get back to doing. Any necessary digital X-rays, taken on site.
        - listitem [ref=e291]:
          - generic [ref=e292]: "2"
          - generic [ref=e293]:
            - heading "Dr. Morgan shows you the imaging, same day" [level=3] [ref=e294]
            - paragraph [ref=e295]: He marks it up and walks you through it right there. You will see what he sees. Most patients get their first adjustment the same visit.
        - listitem [ref=e296]:
          - generic [ref=e297]: "3"
          - generic [ref=e298]:
            - heading "You come back for the full report" [level=3] [ref=e299]
            - paragraph [ref=e300]: Within a few days, Dr. Morgan lays out what he found and exactly what he recommends. What it will take, how long, and what it costs. Then you decide.
      - paragraph [ref=e302]: First visit runs about 30 minutes. After that, most visits take a few minutes. Dr. Morgan built the practice around working people.
    - generic [ref=e305]:
      - generic [ref=e306]:
        - heading "How long until this actually feels better" [level=2] [ref=e329]
        - generic [ref=e330]:
          - paragraph [ref=e331]: Most people want a number before they start. Dr. Morgan will give you one, just not before he has examined you and looked at your imaging. He will not guess.
          - paragraph [ref=e332]: "What he can tell you up front is how it usually goes, including the part most offices skip: the first two weeks are uneven."
        - paragraph [ref=e336]: If you are only trying to get out of pain, a shorter plan can do that. If you want it to stay fixed, it takes about 90 days. Dr. Morgan will give you both options and let you pick.
      - generic [ref=e337]:
        - generic [ref=e339]:
          - generic [ref=e340]: WEEKS 1 TO 2
          - paragraph [ref=e342]: Inconsistent, and that's normal. You'll have a good day and think it's fixed, then a bad one and think it's not working. Dr. Morgan warns you about this on day one. Real change usually starts around the end of week two, and better sleep is often the first thing people notice.
        - generic [ref=e344]:
          - generic [ref=e345]: WEEKS 3 TO 12
          - paragraph [ref=e347]: The bulk of the plan. A typical plan is about 24 visits over 90 days, two to three times a week at the start, then less often as you improve. Some people need fewer. Dr. Morgan checks your progress along the way.
        - generic [ref=e349]:
          - generic [ref=e350]: AFTER YOUR PLAN
          - paragraph [ref=e352]: Most patients move to maintenance, about once every two weeks. Some stop entirely. Dr. Morgan will tell you when you're there.
